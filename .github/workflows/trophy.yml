name: Generate Trophy

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate trophy svg
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: asad9333
          file: trophy.svg
          theme: algolia
          no-background: true
          no-frame: true
          margin-width: 15
          max-cols: 7
          token: ${{ secrets.TROPHY_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --staged --quiet || git commit -m "chore: update trophy.svg"
          git push
